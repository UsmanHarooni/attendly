[project]
name = "attendly"
version = "1.0.0"
description = "Face-recognition attendance system for schools, colleges and workplaces"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy",
    "opencv-python",
    "opencv-contrib-python",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
exclude = ["build", "data", "assets", "screenshots"]